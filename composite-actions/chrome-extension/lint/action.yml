name: 'Lint Chrome Extension'
description: 'Runs ESLint on Chrome extension JavaScript and TypeScript files'
author: 'Your Organization'

inputs:
  extension-dir:
    description: 'Directory containing extension files'
    required: false
    default: 'extension'
  max-warnings:
    description: 'Maximum number of warnings allowed'
    required: false
    default: '0'
  fix:
    description: 'Auto-fix linting issues'
    required: false
    default: 'false'
  config-file:
    description: 'Path to ESLint config file'
    required: false
    default: ''
  ignore-pattern:
    description: 'Patterns to ignore (space-separated)'
    required: false
    default: 'node_modules/** dist/** build/**'

outputs:
  lint-status:
    description: 'Lint status (success/failure)'
    value: ${{ steps.lint.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Check for ESLint config
      id: check-eslint
      env:
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.yml" ] || [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f "eslint.config.cjs" ]; then
          echo "config_found=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$INPUT_CONFIG_FILE" ] && [ -f "$INPUT_CONFIG_FILE" ]; then
          echo "config_found=true" >> "$GITHUB_OUTPUT"
        else
          echo "config_found=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Install ESLint and TypeScript parser when needed
      env:
        EXTENSION_DIR: ${{ inputs.extension-dir }}
      run: |
        if ! npm list eslint --depth=0 >/dev/null 2>&1; then npm install --no-save eslint; fi
        if find "$EXTENSION_DIR" -type f \( -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q .; then
          if ! npm list typescript-eslint --depth=0 >/dev/null 2>&1; then npm install --no-save typescript-eslint; fi
        fi
      shell: bash

    - name: Run ESLint
      id: lint
      env:
        INPUT_MAX_WARNINGS: ${{ inputs.max-warnings }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_IGNORE_PATTERN: ${{ inputs.ignore-pattern }}
        INPUT_EXTENSION_DIR: ${{ inputs.extension-dir }}
      run: |
        ESLINT_ARGS=("--max-warnings" "$INPUT_MAX_WARNINGS")
        [ "$INPUT_FIX" == "true" ] && ESLINT_ARGS+=("--fix")
        [ -n "$INPUT_CONFIG_FILE" ] && ESLINT_ARGS+=("--config" "$INPUT_CONFIG_FILE")
        read -ra PATTERNS <<< "$INPUT_IGNORE_PATTERN"
        for pattern in "${PATTERNS[@]}"; do [ -n "$pattern" ] && ESLINT_ARGS+=("--ignore-pattern" "$pattern"); done
        npx eslint "$INPUT_EXTENSION_DIR" --ext .js,.jsx,.ts,.tsx "${ESLINT_ARGS[@]}" --format stylish
      shell: bash

    - name: Report auto-fixes
      if: inputs.fix == 'true' && steps.lint.outcome == 'success'
      run: |
        if git diff --quiet; then echo "No auto-fixes applied"; else echo "ESLint auto-fixes were applied; commit them separately"; fi
      shell: bash

branding:
  icon: 'code'
  color: 'yellow'
