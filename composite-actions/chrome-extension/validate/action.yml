name: 'Validate Chrome Extension'
description: 'Validates manifest.json and required extension files'
author: 'Your Organization'

inputs:
  extension-dir:
    description: 'Directory containing extension files'
    required: false
    default: 'extension'
  manifest-version:
    description: 'Expected manifest version (2 or 3)'
    required: false
    default: '3'
  check-icons:
    description: 'Validate that declared icons exist'
    required: false
    default: 'true'
  strict-mode:
    description: 'Enable strict validation (fail on warnings)'
    required: false
    default: 'false'
  release-compliance:
    description: 'Validate release/store compliance metadata'
    required: false
    default: 'false'

outputs:
  validation-status:
    description: 'Validation status (success/failure)'
    value: ${{ steps.validate.outcome }}
  manifest-version:
    description: 'Detected manifest version'
    value: ${{ steps.manifest-info.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Check required extension files
      id: validate
      env:
        EXT_DIR: ${{ inputs.extension-dir }}
        EXPECTED_MANIFEST_VERSION: ${{ inputs.manifest-version }}
        STRICT_MODE: ${{ inputs.strict-mode }}
      run: |
        set -e
        test -f "$EXT_DIR/manifest.json" || { echo "::error::Missing manifest.json in $EXT_DIR"; exit 1; }
        jq empty "$EXT_DIR/manifest.json" >/dev/null 2>&1 || { echo "::error::manifest.json is not valid JSON"; exit 1; }
        ACTUAL_VERSION=$(jq -r '.manifest_version' "$EXT_DIR/manifest.json")
        if [ "$ACTUAL_VERSION" != "$EXPECTED_MANIFEST_VERSION" ]; then
          MSG="Expected manifest_version $EXPECTED_MANIFEST_VERSION, found $ACTUAL_VERSION"
          if [ "$STRICT_MODE" == "true" ]; then echo "::error::$MSG"; exit 1; else echo "::warning::$MSG"; fi
        fi
      shell: bash

    - name: Extract Manifest Info
      id: manifest-info
      env: { EXT_DIR: ${{ inputs.extension-dir }} }
      run: |
        IFS=$'\t' read -r VERSION NAME EXT_VERSION < <(jq -r '[(.manifest_version // "Unknown"), (.name // "Unknown"), (.version // "Unknown")] | @tsv' "$EXT_DIR/manifest.json")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "extension_version=$EXT_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Validate Icon Files
      if: inputs.check-icons == 'true'
      env: { EXT_DIR: ${{ inputs.extension-dir }} }
      run: |
        set -e
        missing=0
        while IFS=$'\t' read -r size path; do
          if [ -n "$path" ] && [ ! -f "$EXT_DIR/$path" ]; then echo "::error::Missing icon $size: $path"; missing=1; fi
        done < <(jq -r '(.icons // {}) | to_entries[] | "\(.key)\t\(.value)"' "$EXT_DIR/manifest.json")
        exit "$missing"
      shell: bash

    - name: Validate Release Assets and Compliance
      if: inputs.release-compliance == 'true'
      env: { EXT_DIR: ${{ inputs.extension-dir }} }
      run: python3 "${{ github.action_path }}/../../../scripts/validate-release-assets.py" --path . --type chrome-extension --ext-dir "$EXT_DIR"
      shell: bash

branding:
  icon: 'check-circle'
  color: 'green'
